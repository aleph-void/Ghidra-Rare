# Reusable workflow for the aleph-void forks of community processor modules. Each fork's
# ghidra-rare branch calls it to build its module for the three newest Ghidra releases:
# - pushes and pull requests keep the zips as workflow artifacts;
# - a ghidra-rare-v* tag publishes them as a GitHub release (the prefix keeps clear of upstream's
#   own tags);
# - the weekly schedule (check_new) releases "ghidra-rare-ghidra-<version>" when a new Ghidra
#   version is out that no release of the fork has a build for yet.
#
#   jobs:
#     release:
#       uses: aleph-void/Ghidra-Rare/.github/workflows/module-release.yml@main
#       with:
#         module_dir: .        # path of Module.manifest in the fork
#         name: OpenRISC       # extension name
#         check_new: ${{ github.event_name == 'schedule' || inputs.check_new == true }}
#       permissions:
#         contents: write
name: Module release builds

on:
  workflow_call:
    inputs:
      module_dir:
        description: Directory holding Module.manifest, relative to the repository root
        type: string
        default: .
      name:
        description: Extension name used for the zip
        type: string
        required: true
      ghidra_versions:
        description: Space-separated Ghidra versions (default is the three newest releases)
        type: string
        default: ''
      keep_build:
        description: Build with the module's own Gradle build files instead of Ghidra-Rare's standard build
        type: boolean
        default: false
      check_new:
        description: Only build and release if no release has builds for the newest Ghidra yet
        type: boolean
        default: false
      tag_prefix:
        description: Prefix for the release tag created by check_new
        type: string
        default: ghidra-rare-

jobs:
  versions:
    name: Pick Ghidra versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      proceed: ${{ steps.pick.outputs.proceed }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aleph-void/Ghidra-Rare
          sparse-checkout: tools
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.ghidra_versions }}
          CHECK_NEW: ${{ inputs.check_new }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: tools/ghidra-versions.sh

  build:
    name: Ghidra ${{ matrix.ghidra.version }}
    needs: versions
    if: needs.versions.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: actions/checkout@v4
        with:
          repository: aleph-void/Ghidra-Rare
          path: ghidra-rare
          sparse-checkout: tools

      - name: Download Ghidra ${{ matrix.ghidra.version }}
        env:
          URL: ${{ matrix.ghidra.url }}
          SHA256: ${{ matrix.ghidra.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ghidra.zip" "$URL"
          if [ -n "$SHA256" ]; then
            echo "$SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c
          else
            echo "::warning::GitHub publishes no digest for this release; download not verified"
          fi
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          ghidra=$(ls -d "$RUNNER_TEMP"/ghidra/ghidra_*_PUBLIC)
          echo "GHIDRA_INSTALL_DIR=$ghidra" >> "$GITHUB_ENV"
          # Each Ghidra release states the oldest JDK it supports (12.1: 21, 12.2: 25).
          echo "JAVA_MIN=$(sed -n 's/^application.java.min=//p' "$ghidra/Ghidra/application.properties")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MIN }}

      - name: Build extension
        env:
          MODULE_DIR: ${{ inputs.module_dir }}
          NAME: ${{ inputs.name }}
          KEEP_BUILD: ${{ inputs.keep_build }}
        run: |
          flags="--standard"
          [ "$KEEP_BUILD" = true ] && flags="$flags --keep-build"
          ghidra-rare/tools/build-module.sh $flags --name "$NAME" "$GHIDRA_INSTALL_DIR" "module/$MODULE_DIR" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-${{ matrix.ghidra.version }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [versions, build]
    if: startsWith(github.ref, 'refs/tags/') || needs.versions.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.versions.outputs.tag }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          tag=${NEW_TAG:-$GITHUB_REF_NAME}
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ -n "$NEW_TAG" ]; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Builds for Ghidra ${tag##*ghidra-}" \
                --notes "Automatic release: Ghidra ${tag##*ghidra-} is out. The zips build this commit for the three newest Ghidra releases."
            else
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
            fi
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber *.zip SHA256SUMS
