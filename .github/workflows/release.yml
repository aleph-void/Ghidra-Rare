# Builds every module, including the community submodules, as Ghidra extension zips for the three
# newest Ghidra releases.
# - Pushes and pull requests upload the zips as workflow artifacts.
# - A v* tag publishes them as a GitHub release.
# - Every Monday the workflow checks for a new Ghidra release; if no release here has builds for
#   it yet, it publishes "ghidra-<version>" from main. Run it by hand with check_new to do the same
#   now, or with ghidra_versions to build other versions.
name: Release builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      ghidra_versions:
        description: Space-separated Ghidra versions, e.g. "12.2 12.1.4" (default is the three newest releases)
        required: false
        default: ''
      check_new:
        description: Release only if no release has builds for the newest Ghidra yet (what the weekly run does)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  versions:
    name: Pick Ghidra versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      proceed: ${{ steps.pick.outputs.proceed }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.ghidra_versions }}
          CHECK_NEW: ${{ github.event_name == 'schedule' || inputs.check_new == true }}
          TAG_PREFIX: ''
        run: tools/ghidra-versions.sh

  build:
    name: Ghidra ${{ matrix.ghidra.version }}
    needs: versions
    if: needs.versions.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Ghidra ${{ matrix.ghidra.version }}
        env:
          URL: ${{ matrix.ghidra.url }}
          SHA256: ${{ matrix.ghidra.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ghidra.zip" "$URL"
          if [ -n "$SHA256" ]; then
            echo "$SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c
          else
            echo "::warning::GitHub publishes no digest for this release; download not verified"
          fi
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          ghidra=$(ls -d "$RUNNER_TEMP"/ghidra/ghidra_*_PUBLIC)
          echo "GHIDRA_INSTALL_DIR=$ghidra" >> "$GITHUB_ENV"
          # Each Ghidra release states the oldest JDK it supports (12.1: 21, 12.2: 25).
          echo "JAVA_MIN=$(sed -n 's/^application.java.min=//p' "$ghidra/Ghidra/application.properties")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MIN }}

      - name: Build extensions
        run: tools/build-release.sh "$GHIDRA_INSTALL_DIR" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-${{ matrix.ghidra.version }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [versions, build]
    if: startsWith(github.ref, 'refs/tags/v') || needs.versions.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.versions.outputs.tag }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          tag=${NEW_TAG:-$GITHUB_REF_NAME}
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ -n "$NEW_TAG" ]; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Builds for Ghidra ${tag#ghidra-}" \
                --notes "Automatic release: Ghidra ${tag#ghidra-} is out. The zips build this commit for the three newest Ghidra releases."
            else
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
            fi
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber *.zip SHA256SUMS
